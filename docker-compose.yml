services:
  backend-api:
    build:
      context: ./backend
    env_file:
      - .env
    image: sunwooo/portfolio-backend:latest
    ports:
      - "8080:8080"
    restart: always

  frontend-web:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://swportfolioservices.com
    image: sunwooo/portfolio-frontend:latest
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend-api