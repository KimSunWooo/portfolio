services:
  backend-api:
    build:
      context: ./backend
    env_file:
      - .env
    image: sunwooo/portfolio-backend:latest
    ports:
      - "8080:8080"
    restart: always

  frontend-web:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://swportfolioservices.com
    # 🌟 핵심: 프론트엔드도 .env 파일을 읽도록 추가!
    env_file:
      - .env
    image: sunwooo/portfolio-frontend:latest
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend-api

  redis:
    image: redis:alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    restart: always