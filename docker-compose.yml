services:
  backend-api:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: always

  frontend-web:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend-api