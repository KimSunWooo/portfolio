name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # main 브랜치에 푸시될 때만 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 백엔드 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portfolio-backend:latest

      - name: 프론트엔드 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portfolio-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://swportfolioservices.com

  deploy:
    needs: build-and-push # 빌드가 성공해야 배포 실행
    runs-on: ubuntu-latest
    steps:
      - name: EC2에 SSH 접속하여 배포 실행
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/portfolio  # 💡 EC2 내의 프로젝트 루트 폴더 이름으로 맞춰주세요
            docker compose pull
            docker compose up -d
            docker image prune -f # 사용 안 하는 옛날 이미지 자동 청소