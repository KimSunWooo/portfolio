name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "!**/*.md"
      - "deploy.sh"
      - "ops/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: portfolio-production-deploy
  cancel-in-progress: false

jobs:
  verify-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v5

      - name: 배포와 복구 검증
        run: bash ops/tests/run-deploy-checks.sh

  backend-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v5

      - name: Java 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 백엔드 단위·통합 테스트
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: 백엔드 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
          if-no-files-found: ignore

  frontend-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v5

      # Actions의 Node 24는 이 job의 애플리케이션 런타임이 아니다.
      # 프런트 검사만 Node 22로 고정한다. 운영 이미지의 node:20-alpine은 별도 호환 검증 전이라 바꾸지 않는다.
      - name: Node.js 22 설치
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프런트 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 프런트 lint, 타입, 테스트, 빌드
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://swportfolioservices.com

  build-and-push:
    needs: [verify-deploy, backend-tests, frontend-checks]
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 백엔드 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/portfolio-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/portfolio-backend:latest
          network: host

      - name: 프론트엔드 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/portfolio-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/portfolio-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://swportfolioservices.com

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v5

      - name: 이 커밋의 배포 스크립트를 EC2에 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.sh,ops/lib,ops/nginx"
          target: "portfolio-release/${{ github.sha }}"

      - name: 이 커밋의 deploy.sh 실행
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            SHA="${{ github.sha }}"
            DIR="$HOME/portfolio-release/${SHA}"
            cd "$DIR"
            test -f "$DIR/deploy.sh"
            test -f "$DIR/ops/lib/slots.sh"
            test -f "$DIR/ops/lib/frontend_run.py"
            test -f "$DIR/ops/nginx/rewrite_api_proxy.py"
            test -f "$DIR/ops/nginx/apply-api-upstream.sh"
            test -f "$DIR/ops/nginx/recover-service.sh"
            test ! -e "$DIR/.env"
            chmod +x "$DIR/deploy.sh" "$DIR/ops/nginx/apply-api-upstream.sh" "$DIR/ops/nginx/recover-service.sh"
            export PROJECT_DIR="$HOME/portfolio"
            export ENV_FILE="$PROJECT_DIR/.env"
            export LOCK_FILE="$PROJECT_DIR/.deploy.lock"
            "$DIR/deploy.sh" \
              --backend-image "${{ secrets.DOCKER_USERNAME }}/portfolio-backend:${SHA}" \
              --frontend-image "${{ secrets.DOCKER_USERNAME }}/portfolio-frontend:${SHA}"
