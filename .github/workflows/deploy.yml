name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # 🌟 목적 달성: main 브랜치에 푸시될 때만 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # 백엔드 빌드 테스트 통과를 위한 임시 Redis
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v3

      # 🌟 추가: Docker 빌드 성능과 호환성을 높여주는 Buildx 셋업 (v4 사용 시 권장 표준)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 백엔드 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portfolio-backend:latest
          network: host

      - name: 프론트엔드 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portfolio-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://swportfolioservices.com

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: EC2에 SSH 접속하여 배포 스크립트 실행
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/portfolio
            ./deploy.sh