spring.application.name=backend-api

spring.datasource.url=${DB_URL:jdbc:mysql://database-1.crqkaqs8klyb.ap-northeast-2.rds.amazonaws.com:3306/portfolio_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Existing schema is already managed manually.
# validate is safer than update for a portfolio API server.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Next.js development server
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Cafe24 integration (optional until credentials are prepared)
cafe24.mall-id=${CAFE24_MALL_ID:}
cafe24.client-id=${CAFE24_CLIENT_ID:}
cafe24.client-secret=${CAFE24_CLIENT_SECRET:}
cafe24.redirect-uri=${CAFE24_REDIRECT_URI:}

# AWS S3 설정
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.s3.bucket=2026portfolio
cloud.aws.region.static=ap-northeast-2
cloud.aws.stack.auto=false

# JWT Configuration
# secret 키는 32바이트(256비트) 이상이어야 함.
jwt.secret=my-portfolio-e-commerce-super-secret-key-for-spring-boot-jwt-token-2026
# 토큰 만료 시간 (86400000ms = 24시간)
jwt.expiration=86400000