# 💡 1. 실제 서비스 도메인 연결 (CORS)
app.cors.allowed-origins=https://swportfolioservices.com

# 💡 2. AWS RDS 운영 DB 연결 (비밀번호는 GitHub Secrets에서 ${DB_PASSWORD}로 주입받음)
spring.datasource.url=jdbc:mysql://database-1.crqkaqs8klyb.ap-northeast-2.rds.amazonaws.com:3306/portfolio_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# 💡 3. 운영 환경을 위한 안전한 JPA 설정 (테이블 강제 변경 금지, 쿼리 로그 끄기)
# update 대신 validate를 써서 DB가 꼬이거나 날아가는 대참사를 막습니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false