# Isolated browser verification only. Do not activate this profile in production.
# Origins are the local frontend address. There is no wildcard.
app.cors.allowed-origins=http://localhost:3000

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/portfolio_verify?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=verify-db
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Existing schema created outside Flyway

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6380

jwt.secret=verify-only-jwt-secret-not-for-production-2026
toss.secret-key=verify-not-a-payment-key
cloud.aws.credentials.access-key=verify
cloud.aws.credentials.secret-key=verify
cloud.aws.s3.bucket=verify-local
cloud.aws.region.static=ap-northeast-2

spring.mail.host=127.0.0.1
spring.mail.port=2525
spring.mail.username=verify@localhost
spring.mail.password=verify-not-a-mailbox
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Purchase analytics always reads purchase_orders / purchase_lines.
# Brokers stay off until RABBITMQ_* / KAFKA_* and the matching enabled flags are set.
app.notification.password-changed.enabled=false
app.analytics.product-detail-read.enabled=false
