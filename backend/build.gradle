plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE' 
	implementation 'com.amazonaws:aws-java-sdk-s3:1.12.700'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	testImplementation 'org.testcontainers:testcontainers-rabbitmq'
	testImplementation 'org.testcontainers:testcontainers-kafka'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('seedBulkDemoPurchases', JavaExec) {
	group = 'verification'
	description = 'Insert or clear an explicit DEMO purchase batch (not started by bootRun)'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.project.backend_api.purchase.BulkDemoPurchaseSeedMain'
	if (project.hasProperty('seedArgs')) {
		args((project.property('seedArgs') as String).tokenize())
	}
}

configurations.configureEach {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == 'org.testcontainers') {
			details.useVersion('2.0.5')
			details.because('Spring Boot imports the Testcontainers BOM without versions Gradle can apply')
		}
	}
}

tasks.register('flywayMigrateMain', JavaExec) {
	group = 'verification'
	description = 'Run Flyway migrate against an explicit JDBC URL (not bootRun)'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.project.backend_api.purchase.FlywayMigrateMain'
}
