<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
<style>
text { font-family: "Noto Sans CJK KR", "Noto Sans CJK JP", sans-serif; fill:#111; }
.box { fill:#fff; stroke:#111; stroke-width:1.4; }
.soft { fill:#f4f4f4; stroke:#222; stroke-width:1.2; }
.muted { fill:#666; font-size:12px; }
.title { font-size:15px; font-weight:700; }
.label { font-size:13px; }
.small { font-size:11px; fill:#333; }
</style>

<text class="title" x="24" y="32">로그인 이후 인증 상태</text>
<rect class="box" x="30" y="70" width="190" height="78" rx="2"/><text class="label" x="125" y="100" text-anchor="middle">POST /api/users/login</text><text class="small" x="125" y="122" text-anchor="middle">Access 응답 본문</text>
<rect class="soft" x="250" y="70" width="200" height="78" rx="2"/><text class="label" x="350" y="100" text-anchor="middle">메모리 Access Token</text><text class="small" x="350" y="122" text-anchor="middle">30분 · Authorization Bearer</text>
<rect class="box" x="480" y="70" width="200" height="78" rx="2"/><text class="label" x="580" y="100" text-anchor="middle">HttpOnly Cookie</text><text class="small" x="580" y="122" text-anchor="middle">refreshToken · 14일</text>
<rect class="soft" x="710" y="70" width="180" height="78" rx="2"/><text class="label" x="800" y="100" text-anchor="middle">새로고침</text><text class="small" x="800" y="122" text-anchor="middle">메모리는 비워짐</text>
<rect class="box" x="250" y="200" width="420" height="78" rx="2"/><text class="label" x="460" y="230" text-anchor="middle">POST /api/users/refresh</text><text class="small" x="460" y="252" text-anchor="middle">쿠키의 Refresh로 Access만 재발급 · Refresh는 교체하지 않음</text>
<rect class="soft" x="30" y="320" width="400" height="70" rx="2"/><text class="label" x="230" y="348" text-anchor="middle">필터는 Access만 SecurityContext에 넣음</text><text class="small" x="230" y="370" text-anchor="middle">tokenType=refresh 는 API 인증에 사용하지 않음</text>
<rect class="box" x="460" y="320" width="430" height="70" rx="2"/><text class="label" x="675" y="348" text-anchor="middle">/api/admin/** 는 서버에서 ROLE_ADMIN</text><text class="small" x="675" y="370" text-anchor="middle">화면의 역할 표시와 별도로 hasRole("ADMIN")</text>
<line x1="220" y1="109" x2="250" y2="109" stroke="#111"/>
<line x1="450" y1="109" x2="480" y2="109" stroke="#111"/>
<line x1="680" y1="109" x2="710" y2="109" stroke="#111"/>
<line x1="800" y1="148" x2="800" y2="180" stroke="#111"/><line x1="800" y1="180" x2="670" y2="180" stroke="#111"/><line x1="670" y1="180" x2="670" y2="200" stroke="#111"/>

</svg>